<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>魔法小屋自动化测试</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="screen active" id="screen-home"></div>
  <div class="screen" id="screen-dressup"></div>
  <div class="screen" id="screen-room"></div>
  <div class="screen" id="screen-living"></div>
  <div class="screen" id="screen-bathroom"></div>
  <div class="screen" id="screen-kitchen"></div>
</div>
<pre id="test-result" style="position:fixed;top:0;left:0;z-index:99999;background:#fff;font-size:16px;padding:10px;"></pre>
<script src="js/store.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/assets-doll.js"></script>
<script src="js/assets-room.js"></script>
<script src="js/assets-kitchen.js"></script>
<script src="js/dressup.js"></script>
<script src="js/room.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/main.js"></script>
<script>
/* ============ 自动化交互测试（配合 chrome --headless --dump-dom） ============ */
(function () {
  'use strict';
  const results = [];
  const log = (name, ok, detail) => {
    results.push(`${ok ? 'PASS' : 'FAIL'} | ${name}${detail ? ' | ' + detail : ''}`);
  };
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const activeScreen = () => document.querySelector('.screen.active').id;
  const click = elm => elm.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  const pe = (type, elm, x, y) => elm.dispatchEvent(new PointerEvent(type, {
    bubbles: true, clientX: x, clientY: y, pointerId: 1, isPrimary: true
  }));
  const center = elm => {
    const r = elm.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2, r];
  };
  /* 用房间切换条去某个房间 */
  async function gotoRoom(id) {
    click($('.screen.active .btn-rooms'));
    await sleep(80);
    click(document.querySelector(`.room-pick[data-room="${id}"]`));
    await sleep(80);
  }

  async function run() {
    try {
      Store.reset();
      await sleep(50);

      /* ---- 1. 主界面 ---- */
      const doors = $$('#screen-home .door-group');
      log('主界面一扇大门', doors.length === 1 && doors[0].classList.contains('door-big'), `doors=${doors.length}`);
      const helpBtn = $('#screen-home .btn-help');
      click(helpBtn);
      await sleep(50);
      log('家长指南打开', !$('#screen-home .help-overlay').classList.contains('hidden'));
      click($('#screen-home .help-close'));
      await sleep(50);
      log('家长指南关闭', $('#screen-home .help-overlay').classList.contains('hidden'));
      click($('#screen-home .btn-sound'));
      await sleep(50);
      log('声音开关-关', Store.state.sound === false, `sound=${Store.state.sound}`);
      click($('#screen-home .btn-sound'));
      await sleep(50);
      log('声音开关-开', Store.state.sound === true, `sound=${Store.state.sound}`);
      click(doors[0]);
      await sleep(400);
      log('点大门进上次房间(默认卧室)', activeScreen() === 'screen-room', activeScreen());

      /* ---- 2. 房间切换条 ---- */
      click($('#screen-room .btn-rooms'));
      await sleep(80);
      const picks = $$('.room-pick');
      log('切换条五个房间', picks.length === 5, `picks=${picks.length}`);
      log('切换条展开', !$('.room-picker').classList.contains('hidden'));
      click($('.room-pick-close'));
      await sleep(50);
      log('切换条收起', $('.room-picker').classList.contains('hidden'));
      await gotoRoom('dressup');
      log('切换到换衣间', activeScreen() === 'screen-dressup', activeScreen());
      log('记住上次房间', Store.state.lastRoom === 'dressup', Store.state.lastRoom);

      /* ---- 3. 换装 ---- */
      const dollLayers0 = $$('#screen-dressup .doll-wrap .doll-layer').length;
      log('娃娃分层渲染', dollLayers0 === 6, `layers=${dollLayers0}`);
      const dressTab = [...$$('.tab-btn')].find(t => t.dataset.cat === 'dress');
      click(dressTab);
      await sleep(50);
      const dressCards = $$('#screen-dressup .item-card');
      log('裙子物品卡', dressCards.length === 8, `cards=${dressCards.length}`);
      click([...dressCards].find(c => c.dataset.key === 'ocean'));
      await sleep(50);
      log('换裙子生效', Store.state.doll.dress === 'ocean', Store.state.doll.dress);
      const hairTab = [...$$('.tab-btn')].find(t => t.dataset.cat === 'hair');
      click(hairTab);
      await sleep(50);
      click([...$$('#screen-dressup .item-card')].find(c => c.dataset.key === 'buns'));
      await sleep(50);
      log('换发型生效', Store.state.doll.hair === 'buns', Store.state.doll.hair);
      const accTab = [...$$('.tab-btn')].find(t => t.dataset.cat === 'acc');
      click(accTab);
      await sleep(50);
      click([...$$('#screen-dressup .item-card')].find(c => c.dataset.key === 'wings'));
      await sleep(50);
      log('换配饰生效', Store.state.doll.acc === 'wings', Store.state.doll.acc);
      Store.saveNow();
      const saved = JSON.parse(localStorage.getItem('magic-house-v1'));
      log('装扮自动存档', saved.doll.dress === 'ocean' && saved.doll.hair === 'buns', saved.doll.dress);

      /* ---- 4. 卧室 ---- */
      await gotoRoom('room');
      log('切换到卧室', activeScreen() === 'screen-room', activeScreen());
      log('房间娃娃联动', $('#screen-room .room-doll .doll-layer') !== null);
      const bedCard = [...$$('#screen-room .item-card')].find(c => c.dataset.id === 'bed');
      const rugCard = [...$$('#screen-room .item-card')].find(c => c.dataset.id === 'rug');
      click(bedCard);
      await sleep(100);
      click(rugCard);
      await sleep(100);
      log('添加家具', Store.state.rooms.bedroom.items.length === 2, `items=${Store.state.rooms.bedroom.items.length}`);
      const bedNode = [...$$('#screen-room .room-item')].find(n => {
        const i = +n.dataset.i; return Store.state.rooms.bedroom.items[i] && Store.state.rooms.bedroom.items[i].id === 'bed';
      });
      log('床已渲染', !!bedNode);
      const [cx, cy] = center(bedNode);
      const x0 = Store.state.rooms.bedroom.items.find(i => i.id === 'bed').x;
      pe('pointerdown', bedNode, cx, cy);
      pe('pointermove', bedNode, cx + 180, cy + 60);
      pe('pointerup', bedNode, cx + 180, cy + 60);
      await sleep(50);
      const x1 = Store.state.rooms.bedroom.items.find(i => i.id === 'bed').x;
      log('拖动家具', x1 > x0 + 0.05, `x ${x0.toFixed(2)} -> ${x1.toFixed(2)}`);
      const bRect = $('#screen-room .drop-basket').getBoundingClientRect();
      const baskX = bRect.left + bRect.width / 2, baskY = bRect.top + bRect.height / 2;
      const [bx0, by0] = center(bedNode);
      pe('pointerdown', bedNode, bx0, by0);
      pe('pointermove', bedNode, bx0 - 200, by0 - 100);
      pe('pointermove', bedNode, baskX, baskY);
      pe('pointerup', bedNode, baskX, baskY);
      await sleep(400);
      log('拖进收纳筐收走', Store.state.rooms.bedroom.items.length === 1, `items=${Store.state.rooms.bedroom.items.length}`);
      const cleanBtn = $('#screen-room .btn-clean');
      click(cleanBtn);
      await sleep(50);
      log('收起模式开启', $$('#screen-room .room-item.removable').length >= 1
        && !$('#screen-room .clean-banner').classList.contains('hidden'));
      const rugNode = [...$$('#screen-room .room-item')][0];
      const [rx, ry] = center(rugNode);
      pe('pointerdown', rugNode, rx, ry);
      await sleep(400);
      log('收走家具', Store.state.rooms.bedroom.items.length === 0, `items=${Store.state.rooms.bedroom.items.length}`);
      click(cleanBtn);
      click($$('#screen-room .btn-palette')[0]);
      await sleep(50);
      const swatches = $$('#screen-room .palette-pop .swatch');
      log('墙纸色板(含瓷砖8款)', swatches.length === 8, `swatches=${swatches.length}`);
      click(swatches[6]);
      await sleep(100);
      log('换白瓷砖墙纸', Store.state.rooms.bedroom.wall === 6, `wall=${Store.state.rooms.bedroom.wall}`);
      log('调色板自动关闭', !$('#screen-room .palette-pop'));

      /* ---- 5. 客厅 ---- */
      await gotoRoom('living');
      log('切换到客厅', activeScreen() === 'screen-living', activeScreen());
      const livingCards = $$('#screen-living .item-card');
      log('客厅家具卡16件', livingCards.length === 16, `cards=${livingCards.length}`);
      log('含电视/鱼缸/摇椅', !!Store.state && ['tv', 'fishtank', 'armchair'].every(id =>
        [...livingCards].some(c => c.dataset.id === id)));
      const tvCard = [...livingCards].find(c => c.dataset.id === 'tv');
      click(tvCard);
      await sleep(150);
      log('客厅加电视', Store.state.rooms.living.items.length === 1, `items=${Store.state.rooms.living.items.length}`);
      const tvNode = [...$$('#screen-living .room-item')][0];
      const [tx, ty] = center(tvNode);
      pe('pointerdown', tvNode, tx, ty);
      pe('pointerup', tvNode, tx, ty);
      await sleep(100);
      log('轻点电视互动不误删', Store.state.rooms.living.items.length === 1, `items=${Store.state.rooms.living.items.length}`);
      log('客厅娃娃联动', $('#screen-living .room-doll .doll-layer') !== null);

      /* ---- 6. 卫生间 ---- */
      await gotoRoom('bathroom');
      log('切换到卫生间', activeScreen() === 'screen-bathroom', activeScreen());
      const bathCards = $$('#screen-bathroom .item-card');
      log('卫生间家具卡11件', bathCards.length === 11, `cards=${bathCards.length}`);
      const tubCard = [...bathCards].find(c => c.dataset.id === 'bathtub');
      click(tubCard);
      await sleep(150);
      log('卫生间加浴缸', Store.state.rooms.bathroom.items.length === 1, `items=${Store.state.rooms.bathroom.items.length}`);
      const tubNode = [...$$('#screen-bathroom .room-item')][0];
      const [ux, uy] = center(tubNode);
      pe('pointerdown', tubNode, ux, uy);
      pe('pointerup', tubNode, ux, uy);
      await sleep(200);
      log('轻点浴缸冒泡泡', Store.state.rooms.bathroom.items.length === 1
        && $$('#screen-bathroom .fx-sparkle').length >= 0, '无崩溃即通过');
      log('卫生间独立墙纸(默认白瓷砖)', Store.state.rooms.bathroom.wall === 6, `wall=${Store.state.rooms.bathroom.wall}`);

      /* ---- 7. 厨房 ---- */
      await gotoRoom('kitchen');
      log('切换到厨房', activeScreen() === 'screen-kitchen', activeScreen());
      const recipeCards = $$('.recipe-card');
      log('三张食谱卡', recipeCards.length === 3, `cards=${recipeCards.length}`);
      click([...recipeCards].find(c => c.dataset.recipe === 'salad'));
      await sleep(100);
      log('选食谱进入做菜', !$('#screen-kitchen .cook-stage').classList.contains('hidden'));
      const ingCards = $$('#screen-kitchen .item-drawer .item-card');
      log('沙拉食材卡', ingCards.length === 7, `cards=${ingCards.length}`);
      click(ingCards[0]);
      await sleep(600);
      click(ingCards[1]);
      await sleep(600);
      const zone = $('#screen-kitchen .pot-zone');
      const [zx, zy, zr] = center(zone);
      const cy0 = zr.top + zr.height * 0.38;
      for (let i = 0; i <= 40; i++) {
        const a = (i / 40) * Math.PI * 4;
        pe('pointermove', zone, zx + Math.cos(a) * 60, cy0 + Math.sin(a) * 40);
      }
      await sleep(100);
      const lit = $$('#screen-kitchen .stir-star.lit').length;
      log('搅拌点亮星星', lit === 3, `lit=${lit}`);
      log('魔法按钮激活', !$('#screen-kitchen .btn-magic').classList.contains('dim'));
      click($('#screen-kitchen .btn-magic'));
      await sleep(2500);
      log('烹饪出成品', !$('#screen-kitchen .dish-result').classList.contains('hidden'));
      click($('#screen-kitchen .btn-feed'));
      await sleep(100);
      log('喂食按钮有反馈', $('#screen-kitchen .btn-feed').classList.contains('eat-done'));
      click($('#screen-kitchen .dish-result .btn-home'));
      await sleep(100);
      log('返回食谱选择', !$('#screen-kitchen .recipe-stage').classList.contains('hidden'));

      /* ---- 8. 回家 & 大门记忆 ---- */
      click($('#screen-kitchen .btn-home'));
      await sleep(400);
      log('回家按钮', activeScreen() === 'screen-home', activeScreen());
      click($('#screen-home .door-group'));
      await sleep(400);
      log('大门直达上次的厨房', activeScreen() === 'screen-kitchen', activeScreen());

    } catch (err) {
      results.push('FAIL | 测试异常中断 | ' + (err && err.message));
    }
    const fails = results.filter(r => r.startsWith('FAIL')).length;
    results.unshift(`==== 测试完成：${results.length} 项，失败 ${fails} 项 ====`);
    $('#test-result').textContent = results.join('\n');
    document.title = fails === 0 ? 'ALL_PASS' : `FAIL_${fails}`;
  }
  window.addEventListener('DOMContentLoaded', () => setTimeout(run, 100));
})();
</script>
</body>
</html>
